name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Inline scripts parse
        run: |
          node -e "
          const s = require('fs').readFileSync('index.html', 'utf8');
          const js = [...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]).join('\n');
          new Function(js);
          "
      - name: Every local file the page references exists
        run: |
          grep -o -E '(assets|print)[^"'\'' )]*\.(css|jpg|png|mp4|pdf|svg)' index.html | sort -u | while read -r f; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - run: tflint --recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

name: pages

# Serves the site on GitHub Pages until the AWS account is verified for CloudFront.
on:
  push:
    branches: [main]
    paths: ["index.html", "print.css", "favicon.svg", "assets/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Only the site is published, not the Terraform or the workflows.
      - name: Collect site files
        run: |
          mkdir _site
          cp -R index.html print.css favicon.svg assets _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

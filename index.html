<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tapiwa Magumise</title>
<meta name="description" content="Tapiwa Magumise, cloud engineer. Nine AWS projects with code and results, CV and contact.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --font-ui: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --text: #1d1d1f;
    --text-muted: #5a5a60;
    --menubar-bg: rgba(242, 242, 244, 0.72);
    --menubar-text: #1d1d1f;
    --dock-bg: rgba(246, 246, 248, 0.5);
    --dock-border: rgba(255, 255, 255, 0.55);
    --window-bg: #ffffff;
    --window-bar: #ececee;
    --window-border: rgba(0, 0, 0, 0.18);
    --label-text: #111114;
    --label-shadow: 0 0 3px rgba(255, 255, 255, 0.95), 0 0 8px rgba(255, 255, 255, 0.7);
    --login-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    --select: #0a5fcf;
    --dot: rgba(0, 0, 0, 0.55);
    --light-off: #d3d3d6;
    --menu-bg: rgba(246, 246, 248, 0.86);
    --sidebar-bg: #f0f0f3;
    --row-alt: #f6f6f8;
    --pv-bg: #e4e5e9;
    --term-bg: #ffffff;
    --term-text: #1d1d1f;
    --term-dim: #6e6e73;
    --term-link: #0a5fcf;
    --notes-sel: #f6dd8a;
    --body-bg: #9fb6c9;
    --wallpaper: url(assets/catalina-day.jpg);
  }
  :root[data-theme="dark"] {
    --label-text: #ffffff;
    --label-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.55);
    --text: #ececef;
    --text-muted: #a6a6ad;
    --menubar-bg: rgba(28, 28, 32, 0.6);
    --menubar-text: #f2f2f4;
    --dock-bg: rgba(40, 40, 46, 0.45);
    --dock-border: rgba(255, 255, 255, 0.14);
    --window-bg: #232327;
    --window-bar: #2f2f34;
    --window-border: rgba(255, 255, 255, 0.12);
    --select: #3b8cf0;
    --dot: rgba(255, 255, 255, 0.75);
    --light-off: #55555b;
    --menu-bg: rgba(42, 42, 48, 0.86);
    --sidebar-bg: #29292e;
    --row-alt: #29292d;
    --pv-bg: #1c1c1f;
    --term-bg: #1e1e1e;
    --term-text: #e6e6e6;
    --term-dim: #9a9aa0;
    --term-link: #6cb2ff;
    --notes-sel: #6b5a1e;
    --body-bg: #1b2a3c;
    --wallpaper: url(assets/catalina-dusk.jpg);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --label-text: #ffffff;
      --label-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.55);
      --text: #ececef;
      --text-muted: #a6a6ad;
      --menubar-bg: rgba(28, 28, 32, 0.6);
      --menubar-text: #f2f2f4;
      --dock-bg: rgba(40, 40, 46, 0.45);
      --dock-border: rgba(255, 255, 255, 0.14);
      --window-bg: #232327;
      --window-bar: #2f2f34;
      --window-border: rgba(255, 255, 255, 0.12);
      --select: #3b8cf0;
      --dot: rgba(255, 255, 255, 0.75);
      --light-off: #55555b;
      --menu-bg: rgba(42, 42, 48, 0.86);
      --sidebar-bg: #29292e;
      --row-alt: #29292d;
      --pv-bg: #1c1c1f;
      --term-bg: #1e1e1e;
      --term-text: #e6e6e6;
      --term-dim: #9a9aa0;
      --term-link: #6cb2ff;
      --notes-sel: #6b5a1e;
    --light-off: #55555b;
      --body-bg: #1b2a3c;
      --wallpaper: url(assets/catalina-dusk.jpg);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-ui);
    font-size: 16px;
    color: var(--text);
    background: var(--body-bg);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
  :focus-visible { outline: 2px solid var(--select); outline-offset: 2px; }

  /* Wallpaper */
  .wallpaper { position: fixed; inset: 0; background: var(--body-bg) var(--wallpaper) center / cover no-repeat; transition: filter .5s ease; }
  body.locked .wallpaper { filter: blur(22px) brightness(.85); transform: scale(1.08); }

  /* Login */
  .login {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; color: #fff; transition: opacity .45s ease;
  }
  body:not(.locked) .login { opacity: 0; pointer-events: none; }
  .login img { width: 132px; height: 132px; border-radius: 50%; object-fit: cover; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .login .name { font-size: 22px; font-weight: 600; text-shadow: var(--login-shadow); margin-top: 4px; }
  .login .role { font-size: 15px; opacity: .82; text-shadow: var(--login-shadow); margin-top: -10px; }
  /* The login always shows the dusk contour view; logging in fades it into the desktop wallpaper */
  .login-wall {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s ease;
    background: #0b1220 url(assets/catalina-contour.jpg) center / cover no-repeat;
  }
  .login-wall::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 32% 38% at 50% 50%, rgba(0,0,0,.42), transparent 70%); }
  body.locked .login-wall { opacity: 1; }
  .login .enter {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.4); margin-top: 6px;
  }
  .login .enter:hover { background: rgba(255,255,255,.32); }
  .login .hint { font-size: 14px; opacity: .9; text-shadow: var(--login-shadow); }

  /* Desktop layer */
  .desktop { position: fixed; inset: 0; transition: opacity .45s ease .1s; }
  body.locked .desktop { opacity: 0; pointer-events: none; }

  /* Menu bar */
  .menubar {
    position: absolute; top: 0; left: 0; right: 0; height: 26px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; font-size: 14px; color: var(--menubar-text);
    background: var(--menubar-bg); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  }
  .menubar .left, .menubar .right { display: flex; align-items: center; gap: 4px; height: 100%; }
  /* The notch: part of the hardware, so it sits above everything and ignores the theme */
  .notch {
    position: fixed; top: 0; left: 50%; width: 184px; height: 26px; margin-left: -92px; z-index: 100002;
    background: #000; border-radius: 0 0 10px 10px; pointer-events: none;
  }
  .notch::before, .notch::after {
    content: ""; position: absolute; top: 0; width: 6px; height: 6px;
    background: radial-gradient(circle at 0 100%, transparent 5.5px, #000 6px);
  }
  .notch::before { left: -6px; transform: scaleX(-1); }
  .notch::after { right: -6px; }
  .notch i {
    position: absolute; left: 50%; top: 9px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #1c2433 0 1.5px, #0a0d14 2.5px);
  }
  /* Menus never sit under the notch: the left side stops short of it, and on narrow screens the notch goes */
  .menubar .left { max-width: calc(50% - 104px); overflow: hidden; }
  @media (max-width: 1100px) { .notch { display: none; } .menubar .left { max-width: none; } }
  .menubar .item { padding: 0 9px; height: 22px; display: flex; align-items: center; border-radius: 4px; white-space: nowrap; }
  .menubar .item:hover { background: rgba(127,127,127,.22); }
  .menubar .app { font-weight: 700; }
  .menubar .mark { font-weight: 800; letter-spacing: -.02em; font-size: 15px; }
  .menubar svg { display: block; }
  .clock { font-variant-numeric: tabular-nums; }

  /* Desktop items */
  .desk-icons {
    position: absolute; top: 44px; right: 18px; display: grid; gap: 14px; justify-items: center;
  }
  .desk-icon {
    width: 96px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; border-radius: 6px;
  }
  .desk-icon .glyph { width: 60px; height: 60px; display: grid; place-items: center; }
  .desk-icon .label {
    font-size: 13px; line-height: 1.25; color: var(--label-text); text-shadow: var(--label-shadow); text-align: center;
    padding: 1px 5px; border-radius: 4px;
  }
  .desk-icon.selected .glyph { background: rgba(0,0,0,.18); border-radius: 6px; }
  .desk-icon.selected .label { background: var(--select); color: #fff; text-shadow: none; }

  /* Windows */
  .windows { position: absolute; inset: 0; pointer-events: none; }
  .window {
    position: absolute; display: flex; flex-direction: column; pointer-events: auto; min-width: 300px; min-height: 180px;
    background: var(--window-bg); border-radius: 10px; border: 1px solid var(--window-border);
    box-shadow: 0 22px 60px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.15);
    transition: transform .32s cubic-bezier(.3,.7,.3,1), opacity .32s ease;
  }
  .window.inactive { box-shadow: 0 12px 34px rgba(0,0,0,.22), 0 1px 4px rgba(0,0,0,.12); }
  .window.animating { transition: top .25s ease, left .25s ease, width .25s ease, height .25s ease, transform .32s cubic-bezier(.3,.7,.3,1), opacity .32s ease; }
  .window.fullscreen { border-radius: 0; border: 0; }
  .window.hidden { display: none; }
  .titlebar {
    flex: 0 0 30px; display: flex; align-items: center; padding: 0 12px; background: var(--window-bar); position: relative;
    border-bottom: 1px solid var(--window-border); border-radius: 10px 10px 0 0; touch-action: none;
  }
  .window.fullscreen .titlebar { border-radius: 0; }
  .lights { display: flex; gap: 8px; position: relative; z-index: 1; }
  .lights button { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; }
  .lights svg { opacity: 0; }
  .lights:hover svg, .lights:focus-within svg { opacity: 1; }
  .lights .close { background: #ff5f57; } .lights .min { background: #febc2e; } .lights .zoom { background: #28c840; }
  .window.inactive .lights:not(:hover) button { background: var(--light-off); }
  .titlebar .title { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 600; color: var(--text-muted); pointer-events: none; }
  .window.inactive .titlebar .title { opacity: .6; }
  .titlebar .share { margin-left: auto; position: relative; z-index: 1; width: 24px; height: 22px; display: grid; place-items: center; border-radius: 5px; color: var(--text-muted); }
  .titlebar .share:hover { background: rgba(127,127,127,.2); }
  .window .content { flex: 1; overflow: auto; border-radius: 0 0 10px 10px; user-select: text; }
  .window.fullscreen .content { border-radius: 0; }
  .rz { position: absolute; z-index: 2; }
  .rz.n { top: -4px; left: 8px; right: 8px; height: 8px; cursor: ns-resize; }
  .rz.s { bottom: -4px; left: 8px; right: 8px; height: 8px; cursor: ns-resize; }
  .rz.e { right: -4px; top: 8px; bottom: 8px; width: 8px; cursor: ew-resize; }
  .rz.w { left: -4px; top: 8px; bottom: 8px; width: 8px; cursor: ew-resize; }
  .rz.ne { right: -5px; top: -5px; width: 12px; height: 12px; cursor: nesw-resize; }
  .rz.sw { left: -5px; bottom: -5px; width: 12px; height: 12px; cursor: nesw-resize; }
  .rz.nw { left: -5px; top: -5px; width: 12px; height: 12px; cursor: nwse-resize; }
  .rz.se { right: -5px; bottom: -5px; width: 12px; height: 12px; cursor: nwse-resize; }
  .window.fullscreen .rz { display: none; }
  .doc { padding: 20px 26px 24px; line-height: 1.55; }
  .doc h1 { font-size: 20px; margin: 0 0 10px; }
  .doc p { margin: 0 0 12px; }
  .doc p:last-child { margin-bottom: 0; }
  .doc b { font-weight: 600; }
  .empty { height: 100%; min-height: 120px; display: grid; place-items: center; color: var(--text-muted); font-size: 15px; }

  /* Menus */
  .menubar .item.open { background: rgba(127,127,127,.28); }
  .menu {
    position: absolute; z-index: 99600; min-width: 220px; padding: 5px; display: none;
    background: var(--menu-bg); color: var(--text); border: 1px solid var(--window-border); border-radius: 7px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: 14px;
    backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6);
  }
  .menu.show { display: block; }
  .menu button {
    display: flex; align-items: center; width: 100%; height: 24px; padding: 0 12px 0 22px; border-radius: 4px; text-align: left; position: relative; white-space: nowrap;
  }
  .menu button:not(:disabled):hover, .menu button:not(:disabled):focus-visible { background: var(--select); color: #fff; outline: none; }
  .menu button:disabled { color: var(--text-muted); opacity: .55; }
  .menu button .check { position: absolute; left: 7px; font-size: 12px; }
  .menu hr { border: 0; border-top: 1px solid var(--window-border); margin: 5px 8px; }

  /* Spotlight */
  .spotlight { position: absolute; inset: 0; z-index: 99700; display: none; }
  .spotlight.show { display: block; }
  .spot-box {
    position: absolute; top: 20vh; left: 50%; transform: translateX(-50%); width: min(620px, calc(100vw - 40px));
    background: var(--menu-bg); border: 1px solid var(--window-border); border-radius: 12px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
    backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6);
  }
  .spot-field { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 54px; }
  .spot-field svg { flex: none; color: var(--text-muted); }
  .spot-field input { flex: 1; font: inherit; font-size: 22px; color: var(--text); background: none; border: 0; outline: none; }
  .spot-field input::placeholder { color: var(--text-muted); }
  .spot-results { list-style: none; margin: 0; padding: 0 6px 6px; border-top: 1px solid var(--window-border); max-height: 50vh; overflow: auto; }
  .spot-results:empty { display: none; }
  .spot-results li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 6px; font-size: 15px; margin-top: 4px; }
  .spot-results li .kind { font-size: 13px; color: var(--text-muted); }
  .spot-results li.active { background: var(--select); color: #fff; }
  .spot-results li.active .kind { color: rgba(255,255,255,.8); }
  .spot-results li.none { color: var(--text-muted); }

  /* About This Mac */
  .about { display: flex; gap: 32px; align-items: center; padding: 30px 34px; }
  .about img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; flex: none; }
  .about h1 { font-size: 28px; font-weight: 600; margin: 0; }
  .about .role { color: var(--text-muted); margin: 2px 0 14px; }
  .about dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0 0 18px; font-size: 14px; }
  .about dt { font-weight: 600; }
  .about dd { margin: 0; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; height: 26px; padding: 0 12px; font-size: 14px; border-radius: 6px;
    background: var(--window-bar); color: var(--text); border: 1px solid var(--window-border); text-decoration: none;
  }
  .btn:hover { filter: brightness(.96); }

  /* Get Info */
  .info { padding: 16px 18px 20px; font-size: 14px; }
  .info-head { display: flex; gap: 12px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--window-border); }
  .info-head img { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; }
  .info-name { font-size: 16px; font-weight: 600; }
  .info-sub { color: var(--text-muted); font-size: 13px; }
  .info details { border-bottom: 1px solid var(--window-border); padding: 8px 0; }
  .info summary { font-weight: 600; cursor: default; }
  .info dl { display: grid; grid-template-columns: 84px 1fr; gap: 4px 10px; margin: 8px 0 2px; }
  .info dt { color: var(--text-muted); text-align: right; }
  .info dd { margin: 0; }
  .info p { margin: 8px 0 2px; line-height: 1.5; }
  .window a { color: var(--select); }

  /* Finder */
  .window .content.finder-host { overflow: hidden; }
  .finder { display: flex; height: 100%; user-select: none; }
  .fsb { flex: 0 0 172px; background: var(--sidebar-bg); border-right: 1px solid var(--window-border); padding: 12px 8px; overflow: auto; }
  .fsb h2 { font-size: 11px; font-weight: 600; color: var(--text-muted); margin: 0 0 4px 8px; letter-spacing: .02em; }
  .fsb button { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border-radius: 6px; font-size: 14px; text-align: left; }
  .fsb button:hover { background: rgba(127,127,127,.14); }
  .fsb button.on { background: rgba(127,127,127,.26); }
  .fsb svg { flex: none; color: var(--select); }
  .fmain { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .ftool { flex: 0 0 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--window-border); }
  .ftool .nav { display: flex; gap: 2px; }
  .ftool button { height: 26px; min-width: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--text); }
  .ftool button:hover:not(:disabled) { background: rgba(127,127,127,.18); }
  .ftool button:disabled { opacity: .35; }
  .ftool .where { font-weight: 600; font-size: 15px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ftool .views { display: flex; border: 1px solid var(--window-border); border-radius: 6px; overflow: hidden; }
  .ftool .views button { border-radius: 0; min-width: 32px; }
  .ftool .views button.on { background: rgba(127,127,127,.26); }
  .fview { flex: 1; overflow: auto; padding: 14px; }
  .fview.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); align-content: start; gap: 8px; }
  .fitem { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 4px; border-radius: 6px; }
  .fitem .ic { width: 56px; height: 56px; display: grid; place-items: center; }
  .fitem .nm { font-size: 13px; line-height: 1.3; text-align: center; padding: 1px 5px; border-radius: 4px; word-break: break-word; }
  .fitem.sel .ic { background: rgba(127,127,127,.2); border-radius: 6px; }
  .fitem.sel .nm { background: var(--select); color: #fff; }
  .fview.list { padding: 0; }
  .flist { width: 100%; border-collapse: collapse; font-size: 14px; }
  .flist th { position: sticky; top: 0; background: var(--window-bg); text-align: left; font-weight: 500; font-size: 12px; color: var(--text-muted); padding: 6px 12px; border-bottom: 1px solid var(--window-border); }
  .flist td { padding: 0 12px; height: 28px; white-space: nowrap; }
  .flist tr:nth-child(even) td { background: var(--row-alt); }
  .flist td.k { color: var(--text-muted); }
  .flist .row-name { display: flex; align-items: center; gap: 8px; }
  .flist .row-name svg { width: 18px; height: 18px; flex: none; }
  .flist tr.sel td { background: var(--select); color: #fff; }
  .fempty { color: var(--text-muted); font-size: 14px; padding: 30px; text-align: center; grid-column: 1 / -1; }
  .fpath { flex: 0 0 26px; display: flex; align-items: center; gap: 6px; padding: 0 12px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--window-border); }

  /* Project case studies */
  .case { padding: 22px 28px 28px; line-height: 1.55; font-size: 14px; }
  .case h1 { font-size: 22px; margin: 0 0 2px; }
  .case .meta { color: var(--text-muted); font-size: 13px; margin: 0 0 6px; }
  .case p { margin: 0 0 10px; max-width: 72ch; }
  .case .lede { font-size: 15px; margin-bottom: 16px; }
  .case figure { margin: 0 0 18px; }
  .case figure img { width: 100%; display: block; border: 1px solid var(--window-border); border-radius: 6px; background: #fff; cursor: zoom-in; }
  .case figcaption { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .case h2 { font-size: 15px; margin: 20px 0 8px; }
  .case table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .case th, .case td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--window-border); }
  .case th { font-weight: 600; width: 32%; }
  .case ul { margin: 0; padding-left: 20px; }
  .case li { margin-bottom: 4px; }
  .case .btn-row { margin-top: 22px; }
  .am a { color: inherit; text-decoration: none; }
  .am a:hover { text-decoration: underline; }

  /* Login card: CV and email without entering */
  .login-links { display: flex; gap: 18px; margin-top: 14px; font-size: 14px; }
  .login-links a { color: #fff; text-decoration: none; text-shadow: var(--login-shadow); border-bottom: 1px solid rgba(255,255,255,.6); }
  .login-links a:hover { border-bottom-color: #fff; }

  /* Phones: windows take the full width, the menu bar keeps only what fits */
  @media (max-width: 700px) {
    .menubar .ln { display: none; }
    .menubar .left .item:not(.mark):not(.app):not([data-menu="hire"]) { display: none; }
    .menubar .right .item[aria-hidden="true"], .menubar .app, #clock { display: none; }
    .fsb { display: none; }
    .dock .dock-item { width: 38px; height: 38px; }
    .dock { gap: 4px; }
    .window { left: 0 !important; width: 100% !important; border-radius: 0; }
    .case { padding: 16px 16px 22px; }

    var def = registry[id];
    if (!def) return;
    if (id === 'launchpad') { toggleLaunchpad(); return; }
    if (open[id]) {
      restore(id);
      if (loc && open[id].loc && loc !== open[id].loc) navigate(id, loc);
      focus(id);
      return;
    }

    var el = document.createElement('section');
    el.className = 'window';
    el.setAttribute('aria-label', def.title);
    el.innerHTML = chrome;
    el.querySelector('.title').textContent = def.title;
    var content = el.querySelector('.content');
    var tpl = def.tpl && document.getElementById(def.tpl);
    if (tpl) content.appendChild(tpl.content.cloneNode(true));
    else if (!def.finder && !def.render) content.innerHTML = '<div class="empty">Nothing here yet.</div>';
    content.querySelectorAll('[data-open]').forEach(function (b) {
      b.addEventListener('click', function () { openWindow(b.getAttribute('data-open')); });
    });
    layer.appendChild(el);

    var w = Math.min(def.w, window.innerWidth - 40);
    var h = Math.min(def.h, window.innerHeight - MENU_TOP - 110);
    var x = Math.max(20, Math.round((window.innerWidth - w) / 2) - 140 + cascade * 26);
    var y = MENU_TOP + 44 + cascade * 26;
    cascade = (cascade + 1) % 6;
    place(el, { x: x, y: y, w: w, h: h });

    open[id] = { el: el, fs: false, min: false, prev: null, tile: null };
    wire(id, el);
    if (def.finder) buildFinder(id, content, loc || def.finder);
    if (def.render) def.render(content, id);
    focus(id);
  }

  function wire(id, el) {
    el.addEventListener('pointerdown', function () { if (current !== id) focus(id); });
    el.querySelector('.close').addEventListener('click', function () { close(id); });
    el.querySelector('.min').addEventListener('click', function () { minimise(id); });
    el.querySelector('.zoom').addEventListener('click', function () { toggleFullscreen(id); });
    el.querySelector('.share').addEventListener('click', function () { share(id); });

    var bar = el.querySelector('.titlebar');
    bar.addEventListener('dblclick', function (e) { if (!e.target.closest('button')) toggleFullscreen(id); });
    bar.addEventListener('pointerdown', function (e) {
      if (e.button !== 0 || e.target.closest('button') || open[id].fs) return;
      var r = rectOf(el), sx = e.clientX, sy = e.clientY;
      track(bar, e, function (ev) {
        var nx = Math.min(Math.max(r.x + ev.clientX - sx, 80 - r.w), window.innerWidth - 80);
        var ny = Math.min(Math.max(r.y + ev.clientY - sy, MENU_TOP), window.innerHeight - 40);
        el.style.left = nx + 'px'; el.style.top = ny + 'px';
      });
    });

    el.querySelectorAll('.rz').forEach(function (handle) {
      handle.addEventListener('pointerdown', function (e) {
        if (e.button !== 0) return;
        e.stopPropagation();
        focus(id);
        var d = handle.getAttribute('data-dir'), r = rectOf(el), sx = e.clientX, sy = e.clientY;
        track(handle, e, function (ev) {
          var dx = ev.clientX - sx, dy = ev.clientY - sy;
          var n = { x: r.x, y: r.y, w: r.w, h: r.h };
          if (d.indexOf('e') > -1) n.w = Math.max(MIN_W, r.w + dx);
          if (d.indexOf('s') > -1) n.h = Math.max(MIN_H, r.h + dy);
          if (d.indexOf('w') > -1) { n.w = Math.max(MIN_W, r.w - dx); n.x = r.x + r.w - n.w; }
          if (d.indexOf('n') > -1) {
            var top = Math.max(MENU_TOP, r.y + dy);
            n.h = Math.max(MIN_H, r.y + r.h - top); n.y = r.y + r.h - n.h;
          }
          place(el, n);
        });
      });
    });
  }

      var score = title.indexOf(q) === 0 ? 3 : title.indexOf(q) > -1 ? 2 : (' ' + it.words).indexOf(' ' + q) > -1 ? 1 : 0;
      if (score) hits.push({ it: it, score: score });

  var NOTES = [{"title": "Zimbabwe is not in Stripe’s list of supported countries.", "html": "<p>Zimbabwe is not in Stripe’s list of supported countries. I’m building a Stripe risk monitoring product from Zimbabwe. That’s not the ironic part. The ironic part is that I understand Stripe’s risk system better than most of their merchants do, and I’ve never processed a single payment through it.<\/p><p>Here’s how that happened.<\/p><h2>200 Frozen Account Stories<\/h2><p>Six months ago I started collecting frozen Stripe account posts from Reddit. Not skimming. Collecting. Cataloguing the trigger, the merchant’s response, the outcome. I wanted to know if there was a pattern.<\/p><p>There is. And it’s not the one most people assume.<\/p><p>Most merchants think Stripe freezes accounts because of high risk. That’s close, but it misses the point. Stripe freezes accounts because of <i>unexpected<\/i> risk. The distinction is the entire game.<\/p><h2>The Surprise Principle<\/h2><p>A business processing $50,000 a month with a steady 0.4% dispute rate is fine. That same business with a 0.4% rate that was 0.1% three weeks ago is a problem. Same numbers. Same rate. Completely different signal.<\/p><p>Stripe isn’t asking “is this merchant risky?” They’re asking “is this merchant behaving differently than they were last month?”<\/p><p>I started calling this the Surprise Principle, because every frozen account story I catalogued had the same shape: the merchant’s numbers changed faster than the system expected. Not worse. Just different.<\/p><p>Launched a product. Ran a promotion. Got featured somewhere. Revenue spiked. The merchant sees a success story. Stripe’s pattern detector sees something that looks, to an automated system, almost identical to a compromised account ramping up.<\/p><p>There’s no “heads up, we’re about to grow” button. So the system flags the anomaly and freezes first.<\/p><h2>Three Signals, One Blind Spot<\/h2><p>From the 200+ cases I catalogued, three metrics consistently sit at the center:<\/p><p><b>Dispute rate trajectory.<\/b> The Visa VDMP program kicks in at 0.9%. Mastercard ECM at 1.5%. Stripe’s own threshold sits lower than both. But the number that triggers review isn’t the rate itself. It’s the rate of change. A steady 0.6% is safer than a 0.2% that’s climbing.<\/p><p><b>Refund acceleration.<\/b> A steady 5% refund rate is a business model. A refund rate that jumped from 2% to 8% in two weeks is a signal that something broke. Stripe doesn’t know if it’s a product quality issue or a shipping delay. They just see the graph change shape.<\/p><p><b>Transaction velocity spikes.<\/b> Not just dollar volume. Transaction count matters independently. Going from 200 transactions per month to 2,000 triggers pattern detection regardless of what you’re selling.<\/p><p>And here’s the blind spot: you can see all three numbers in your Stripe dashboard. You cannot see how Stripe’s risk model interprets those numbers relative to your own history. You don’t know if you’re 30 days from a freeze or 300.<\/p><h2>Why I’m Building This From the Outside<\/h2><p>I didn’t plan on doing so but I had to register a UK company from Zimbabwe because Stripe doesn’t operate here. That part took an afternoon. The part that took weeks was everything after.<\/p><p>To accept payments globally, you need a business bank account. I applied to Tide. Rejected. Non-resident director. Revolut Business. Rejected. Requires EEA residency. Starling. UK residents only. Wise Business. Same. Four applications, four rejections, each one taking days of document uploads and verification steps before the “no” arrived.<\/p><p>Payoneer eventually said yes. One out of five.<\/p><p>What should have been a routine admin task, the kind of thing a founder in London or San Francisco does between lunch and their first meeting, took me the better part of a month. Not because the paperwork was complex. Because the system wasn’t built for someone with my passport.<\/p><p>The global payments infrastructure assumes you live in one of about 40 countries. If you do, none of this registers as a problem. If you don’t, you spend your first month as a founder proving you’re allowed to participate before you write a single line of code.<\/p><p>The irony isn’t lost on me. The problem I’m solving, merchants losing their businesses to a platform they depend on but don’t understand, is a problem that exists everywhere Stripe operates. But the infrastructure to build the solution assumes I’m already inside the system I’m trying to fix.<\/p><p>I’m not inside it. I built PayCanary anyway.<\/p><p>In a way, being on the outside is an advantage. I have no legacy Stripe integration to protect. No existing merchant relationship clouding my judgement about what the platform actually does versus what it says it does. I just have the data from 200 merchants who learned the hard way.<\/p><p>Stripe is managing their downside. Most merchants aren’t managing theirs. The merchants who survive aren’t the ones with the best numbers. They’re the ones whose numbers are predictable.<\/p><h2>Check Your Own Numbers<\/h2><p>Before you close this tab, do one thing. Open your Stripe dashboard. Go to Payments &gt; Disputes. Look at your dispute rate for the last 3 months. Now compare it to the 3 months before that.<\/p><p>If the number went up, it doesn’t matter that it’s still below 0.9%. What matters is the direction.<\/p><p>Now do the same for refunds. Payments &gt; All payments, filter by refunded. Is the refund rate climbing? Flat? Dropping?<\/p><p>If both are climbing, even slowly, you’re moving toward a review trigger and your dashboard won’t warn you until it’s too late.<\/p><p>If you want to see how all three metrics (disputes, refunds, velocity) interact to produce your actual risk level, I built a free diagnostic that runs the same analysis I used on those 200 Reddit cases. Takes 60 seconds: paycanary.io/diagnostic<\/p><h2>The Takeaway<\/h2><p>Stripe doesn’t hate risk. They hate surprises.<\/p><p>A steady “okay” is safer than an unstable “great.” The merchants who get frozen aren’t the riskiest ones. They’re the ones whose numbers changed shape in a way that a pattern detector couldn’t predict.<\/p><p>Monitor the trend, not just the number.<\/p><p>I’m curious: if you’ve had a Stripe freeze or a close call, what triggered it? Was it a volume spike, a dispute cluster, or something else entirely? I’m still cataloguing cases and every story sharpens the model.<\/p><p><i>I write about Stripe risk, payment infrastructure from places it wasn’t designed for, and what it’s actually like to build a SaaS from southern Africa. @gumagatsby everywhere.<\/i><\/p>"}, {"title": "In Zimbabwe, where I’m from, street vendors call their customers “murungu.”", "html": "<p>In Zimbabwe, where I’m from, street vendors call their customers “murungu.” It literally means white person. It comes from the colonial era, when the people with money, the people you sold to, were white. Colonialism ended but the word stuck around. It shifted. Now it just means the customer. The person with the money. The one you need to keep coming back.<\/p><p>This isn’t exclusive to us. In Nigeria, street vendors call their customers “oga,” from the Yoruba word for master or chief. In Kenya, it’s “bwana,” Swahili for sir, a word that was hardened during British colonial rule when Africans were required to address white settlers that way. In South Africa, it was “baas,” Afrikaans for boss, the same word that gave apartheid its ideology of “baasskap,” white mastery.<\/p><p>Four countries. Four words. All originally meant the same thing: the colonizer. The one with the power. And all four got repurposed by street vendors into something else entirely. Now they just mean the customer. The person with the money.<\/p><p>There’s something brutally honest about that. The language carries the history of a power imbalance right there in the slang, and the vendors use it anyway because they understand something fundamental. The murungu has the leverage. Always has. A vendor in Harare knows that if the murungu is unhappy, you give them their money back. You don’t argue. You don’t prove you’re right. Because the cost of being right is losing that customer, losing every customer watching, and spending your afternoon in a fight instead of making sales. The murungu can go anywhere. You can’t.<\/p><p>I think about that a lot now. I’m building a Stripe risk monitoring tool from Harare, and the more dispute cases I read online, the more I realize these vendors understood something most online merchants haven’t figured out. The cost of fighting isn’t just the fight. It’s everything that happens around it. And the person with the money, whether it’s a murungu at a market stall in Harare or a cardholder calling their bank in Ohio, always has more options than you do.<\/p><p>Most merchants fight every Stripe dispute on principle. Someone files a chargeback, it feels like theft, and the instinct is to fight back. But principle has a price, and most merchants don’t know what it actually costs until it’s too late.<\/p><p>I wrote in my last piece about how Stripe watches your trajectory, not your absolute numbers. Disputes are where that trajectory gets decided. And most merchants make the wrong call.<\/p><h2>The Real Cost of a Dispute Isn’t the Fee<\/h2><p>Stripe charges $15 the moment a dispute is filed. That’s gone whether you fight or not.<\/p><p>Since June 2025, if you choose to counter the dispute, there’s an additional $15 counter fee. You get that back if you win. If you lose, you’re out $30 in fees plus the full transaction amount.<\/p><p>But those numbers are the small part. The expensive part is what a dispute does to your dispute rate.<\/p><p>Visa retired its old monitoring programs (VDMP and VFMP) in March 2025 and consolidated everything into VAMP, the Visa Acquirer Monitoring Program. As of April 2026, the merchant threshold is 1.5% in North America, the EU, and Asia Pacific. Exceed that and you’re looking at fines that start at $25,000 per month and can hit $75,000+. Your acquirer (in most cases, Stripe) will pass those fines to you, or more likely, just close your account.<\/p><p>Here’s what most merchants miss: a dispute counts toward your rate whether you win or lose. Fighting a dispute and winning it still adds to the numerator. The only things that don’t count are disputes that get withdrawn before the card network processes them. Pre-dispute alerts (through services like Ethoca or Verifi) can catch these. A refund before the formal dispute is filed can catch these. But once it’s filed, it counts. Period.<\/p><p>So the question isn’t “can I win this dispute?” The question is “what does this dispute do to my rate, and is the transaction amount worth the rate impact?”<\/p><h2>The Math Nobody Does<\/h2><p>Say you’re processing 500 transactions a month. Your current dispute rate is 0.8%, which is 4 disputes. You’re under VAMP’s 1.5% threshold but Stripe starts watching around 0.75%. You’re already on their radar.<\/p><p>A new dispute comes in for $75. You have decent evidence. You think you can win.<\/p><p><b>If you fight it and win:<\/b> your dispute rate still went up because the dispute was filed. You kept the $75 and got the $15 counter fee refunded. Net outcome: +$75, dispute rate increased.<\/p><p><b>If you fight it and lose:<\/b> you lose the $75 transaction, pay $30 in total fees. Net outcome: -$105, dispute rate increased.<\/p><p><b>If you refund before the dispute is formally processed:<\/b> you lose the $75 but the dispute may not count toward your rate (timing dependent). You pay no dispute fees. Net outcome: -$75, dispute rate potentially unchanged.<\/p><p>For a $75 transaction, the best financial outcome of fighting ($75 recovered) is only $0 better than the worst outcome of refunding ($75 lost), but fighting carries rate risk in both scenarios.<\/p><p>The breakeven shifts when transactions get larger. A $500 dispute? Fight it if you have strong evidence. A $2,000 dispute? Definitely fight it. But for anything under $100 with weak evidence, the refund is almost always the better business decision.<\/p><h2>Stripe’s Smart Disputes Changes the Math Again<\/h2><p>Stripe rolled out Smart Disputes in late 2025. It uses AI to automatically submit evidence for you and waives the $15 counter fee. Sounds great until you read the pricing.<\/p><p>If Smart Disputes wins, Stripe takes 30% of the recovered amount as a success fee. On a $50 dispute, that’s $15, same as the manual counter fee. On a $500 dispute, that’s $150. On a $1,000 dispute, $300.<\/p><p>For high-value disputes, you’re almost certainly better off submitting evidence manually and paying the $15 counter fee yourself. Smart Disputes makes sense for low-value, high-volume disputes where you wouldn’t bother submitting evidence manually anyway.<\/p><p>But here’s the thing most people miss about Smart Disputes: even when it wins, the dispute still counts toward your rate. Smart Disputes optimizes for revenue recovery, not rate management. Those are two different problems.<\/p><h2>What Actually Reduces Your Dispute Rate<\/h2><p>Winning disputes doesn’t reduce your rate. Preventing them does.<\/p><p>The single highest-impact thing most merchants can do is fix their billing descriptor. Go to your Stripe dashboard right now. Settings, then Public details, then Statement descriptor. If it says something your customers wouldn’t recognize on their credit card statement, that’s generating disputes from confused customers, not from fraud.<\/p><p>I’ve seen this in dozens of Reddit posts. Merchant runs a business called “FreshBox” but their descriptor says “STRIPE* FBINC”. Customer sees “FBINC” on their statement, doesn’t recognize it, calls their bank, files a dispute for “unauthorized transaction.” The merchant had nothing wrong with their product or service. The billing descriptor created the dispute.<\/p><p>The second thing is giving customers an easier path to a refund than calling their bank. This sounds backwards but it works. A clear refund policy on the checkout page, a confirmation email with “not what you expected? reply for an instant refund,” and a follow-up email 24–48 hours after purchase. Every dispute that becomes a refund request instead is a dispute that never hits your rate.<\/p><p>The third thing is pre-dispute alerts. Ethoca (Mastercard) and Verifi (Visa) both offer services that notify you when a cardholder contacts their bank but before the formal dispute is filed. You get a window, usually 24–72 hours, to refund proactively. The dispute never gets processed. It never touches your rate. For any merchant doing $5k+ MRR with a recurring dispute problem, the cost of these services pays for itself immediately.<\/p><h2>When You Should Fight<\/h2><p>I’m not saying never fight a dispute. I’m saying fight the right ones.<\/p><p>Fight when the transaction is over $200 and you have strong evidence. Login logs, delivery confirmation, signed terms, customer communication showing they received and used the product. If you’ve got that, submit it.<\/p><p>Fight when the dispute reason doesn’t match reality. Someone claims “product not received” but you have tracking showing delivery and a signature. Someone claims “unauthorized transaction” but the purchase was 3DS authenticated and liability shifted to the issuer.<\/p><p>Fight when it’s clearly friendly fraud. The customer used the product for a month, then filed a chargeback. You have usage logs, IP addresses matching the billing address, and email communication confirming they received it. These are worth fighting because the evidence is strong and the pattern will repeat if you don’t.<\/p><p>Don’t fight on principle. Don’t fight because it feels unfair. Don’t fight $40 disputes with mediocre evidence just because the customer was wrong. Your dispute rate doesn’t care who was right.<\/p><h2>The Trajectory Question<\/h2><p>This comes back to what I wrote in my first piece. Stripe doesn’t punish risk. It punishes surprises. A steady dispute rate of 0.5% is fine. A rate that jumps from 0.3% to 0.9% in a month will get you flagged, even though 0.9% is technically under VAMP’s threshold.<\/p><p>Every dispute decision you make is a trajectory decision. Fighting a dispute you’re going to lose doesn’t just cost you the transaction and the fees. It adds a data point to a trend line that Stripe is watching.<\/p><p>The vendors in Harare, Lagos, Nairobi, and Johannesburg figured this out without dashboards or analytics. The murungu, the oga, the bwana, the baas. The words changed meaning but the dynamic didn’t. You manage the relationship, not the argument. You give them their money back, keep your spot, and sell to the next person.<\/p><p>The merchants who keep their Stripe accounts long-term do the same thing. They don’t win every dispute. They never let disputes happen in the first place, and when one does happen, they make the financial decision instead of the emotional one.<\/p><p>I’m building PayCanary to catch this trajectory before it becomes a problem. If you want to see where your Stripe account stands right now, run the free risk diagnostic at paycanary.io/diagnostic.<\/p><p>Has anyone else run the math on when fighting vs refunding actually makes sense for their business? Curious what thresholds other merchants use. Leave your answers in the comments or feel free to DM.<\/p>"}];
  registry.notes.render = function (c, id) {

    var side = c.querySelector('.n-side'), body = c.querySelector('.n-body');
    function show(i) {
      // The first sentence is the note's title, as in macOS Notes
      var rest = NOTES[i].html.replace(NOTES[i].title, '').replace(/^<p>\s*<\/p>/, '').replace(/^<p>\s+/, '<p>');
      body.innerHTML = '<p><b>' + esc(NOTES[i].title) + '</b></p>' + rest;
      body.scrollTop = 0;
      side.querySelectorAll('button').forEach(function (b, j) { b.classList.toggle('on', j === i); });
    }
    NOTES.forEach(function (n, i) {
      var b = document.createElement('button');
      b.textContent = n.title;
      var s = document.createElement('span'); s.textContent = 'Published on Medium and LinkedIn';
      b.appendChild(s);
      b.addEventListener('click', function () { show(i); });
      side.appendChild(b);
    });
    open[id].api = { show: show };
    show(0);
  };
  function openNote(i) {
    openWindow('notes');
    if (open.notes && open.notes.api) open.notes.api.show(i);

  // ---------- Safari ----------
  // Sites that refuse to be shown inside another page (checked 7 Oct 2026 via their X-Frame-Options headers)
  var FAVS = [
    { name: 'PayCanary', url: 'https://paycanary.io', letter: 'P', framable: false },
    { name: 'PayCanary Blog', url: 'https://paycanary.io/blog', letter: 'B', framable: false },

  registry.safari.render = function (c) {
    c.classList.add('safari-host');
    c.innerHTML = '<div class="safari"><div class="sf-bar"><input type="text" aria-label="Address" placeholder="Search or enter website name" spellcheck="false" autocomplete="off">' +
      '<button class="btn sf-new">Open in New Tab</button></div><div class="sf-body"></div></div>';
    var input = c.querySelector('input'), body = c.querySelector('.sf-body'), cur = '';
    function start() {
      cur = ''; input.value = '';
      body.innerHTML = '<div class="sf-start"><h2>Favourites</h2><div class="sf-favs"></div></div>';
      FAVS.forEach(function (f) {
        var b = document.createElement('button');
        b.className = 'sf-fav';
        b.innerHTML = '<b></b><span></span>';
        b.querySelector('b').textContent = f.letter;
        b.querySelector('span').textContent = f.name;
        b.addEventListener('click', function () { go(f.url); });
        body.querySelector('.sf-favs').appendChild(b);
      });
    }
    function go(url) {
      if (!/^https?:\/\//.test(url)) url = 'https://' + url;
      cur = url; input.value = url.replace(/^https:\/\//, '');
      var known = FAVS.filter(function (f) { return f.url === url; })[0];
      if (known && !known.framable) {
        body.innerHTML = '<div class="sf-blocked"><strong></strong><span>This site doesn\'t allow itself to be shown inside another page.</span><button class="btn">Open in New Tab</button></div>';
        body.querySelector('strong').textContent = known.name;
        body.querySelector('button').addEventListener('click', newTab);
        return;
      }
      body.innerHTML = '<iframe sandbox="allow-scripts allow-same-origin allow-forms allow-popups" referrerpolicy="no-referrer"></iframe>' +
        '<div class="sf-note"><span>If this stays blank, the site doesn\'t allow being shown here.</span><button class="btn">Open in New Tab</button></div>';
      body.querySelector('iframe').src = url;
      body.querySelector('.sf-note button').addEventListener('click', newTab);
    }
    function newTab() { if (cur) window.open(cur, '_blank', 'noopener'); }
    c.querySelector('.sf-new').addEventListener('click', function () { if (cur) newTab(); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { var v = input.value.trim(); if (v) go(v); else start(); }
    });
    start();
  };

  // ---------- Calendar ----------
  // Upcoming exams and project milestones: { date: 'YYYY-MM-DD', title: '...', kind: 'Exam' | 'Milestone' }
  var EVENTS = [];
  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function upcoming(n) {
    var today = ymd(new Date());
    return EVENTS.filter(function (e) { return e.date >= today; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; }).slice(0, n);
  }
  function fmtDate(s) { var p = s.split('-'); return new Date(+p[0], p[1] - 1, +p[2]).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); }
  registry.calendar.render = function (c) {
    c.classList.add('cal-host');
    c.innerHTML = '<div class="cal"><div class="cal-main"><div class="cal-head"><h2></h2>' +
      '<div class="views ftool" style="border:0;padding:0;flex:none"><button class="prev" aria-label="Previous month">‹</button><button class="today">Today</button><button class="next" aria-label="Next month">›</button></div>' +
      '</div><div class="cal-grid"></div></div><aside class="cal-side"><h3>Upcoming</h3><div class="cal-up"></div></aside></div>';
    var view = new Date(); view.setDate(1);
    function draw() {
      var y = view.getFullYear(), m = view.getMonth();
      c.querySelector('h2').innerHTML = esc(view.toLocaleDateString(undefined, { month: 'long' })) + ' <span>' + y + '</span>';
      var grid = c.querySelector('.cal-grid');
      grid.innerHTML = '';
      ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach(function (d) {
        var h = document.createElement('div'); h.className = 'cal-dow'; h.textContent = d; grid.appendChild(h);
      });
      var first = (new Date(y, m, 1).getDay() + 6) % 7;
      var start = new Date(y, m, 1 - first), today = ymd(new Date());
      for (var i = 0; i < 42; i++) {
        var d = new Date(start); d.setDate(start.getDate() + i);
        var cell = document.createElement('div'), key = ymd(d);
        cell.className = 'cal-day' + (d.getMonth() !== m ? ' other' : '') + (key === today ? ' today' : '');
        cell.innerHTML = '<span class="n">' + d.getDate() + '</span>';
        EVENTS.filter(function (e) { return e.date === key; }).forEach(function (e) {
          var ev = document.createElement('span'); ev.className = 'cal-ev'; ev.textContent = e.title; cell.appendChild(ev);
        });
        grid.appendChild(cell);
      }
      var up = upcoming(10), box = c.querySelector('.cal-up');
      box.innerHTML = up.length ? '' : '<p class="muted" style="color:var(--text-muted)">No upcoming events.</p>';
      up.forEach(function (e) { var p = document.createElement('p'); p.innerHTML = '<b></b><br><span style="color:var(--text-muted)"></span>'; p.querySelector('b').textContent = e.title; p.querySelector('span').textContent = e.kind + ' · ' + fmtDate(e.date); box.appendChild(p); });
    }
    c.querySelector('.prev').addEventListener('click', function () { view.setMonth(view.getMonth() - 1); draw(); });
    c.querySelector('.next').addEventListener('click', function () { view.setMonth(view.getMonth() + 1); draw(); });
    c.querySelector('.today').addEventListener('click', function () { view = new Date(); view.setDate(1); draw(); });
    draw();
  };

    grid();
  };

  // ---------- System Information: skills as specs ----------
  var SYSINFO = [
    ['Hardware Overview', [
      ['Name', 'Tapiwa Magumise'], ['Full name', RESUME.name], ['Model', RESUME.headline], ['Location', RESUME.location],
      ['Certifications', 'AWS Solutions Architect Associate, AWS Developer Associate'], ['Training', 'Two Alison diplomas (CPD certified), 10 Anthropic AI courses'], ['Spoken', 'English']
    ]]
  ].concat(RESUME.skills.map(function (k) { return [k[0], [['Stack', k[1]]]]; }));
  registry.sysinfo.render = function (c) {
    c.classList.add('si-host');
    c.innerHTML = '<div class="si"><nav class="si-side" aria-label="Sections"></nav><div class="si-main"></div></div>';
    var side = c.querySelector('.si-side'), main = c.querySelector('.si-main');
    function show(i) {
      main.innerHTML = '<h2></h2><dl></dl>';
      main.querySelector('h2').textContent = SYSINFO[i][0] + ':';
      main.querySelector('dl').innerHTML = SYSINFO[i][1].map(function (r) { return '<dt>' + esc(r[0]) + (r[0] ? ':' : '') + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('');
      side.querySelectorAll('button').forEach(function (b, j) { b.classList.toggle('on', j === i); });
    }
    SYSINFO.forEach(function (s, i) {
      var b = document.createElement('button'); b.textContent = s[0];
      b.addEventListener('click', function () { show(i); });
      side.appendChild(b);
    });
    show(0);
  };

  // ---------- Calculator: AWS cost estimate for a serverless API ----------
  // On-demand prices, US East (N. Virginia), from the AWS Price List API:
  // Lambda (x86) and API Gateway files published 1-2 Oct 2026, DynamoDB file published 11 Sep 2026.
  var PRICE = {
    lambdaReq: 0.20 / 1e6,
    lambdaTiers: [[6e9, 0.0000166667], [15e9, 0.0000150000], [Infinity, 0.0000133334]],
    httpApi: [[300e6, 1.00 / 1e6], [Infinity, 0.90 / 1e6]],
    ddbRead: 0.125 / 1e6,
    ddbWrite: 0.625 / 1e6,
    ddbFreeGB: 25,
    ddbGB: 0.25
  };
  function tiered(qty, tiers) {
    var cost = 0, prev = 0;
    for (var i = 0; i < tiers.length && qty > prev; i++) {
      var upto = Math.min(qty, tiers[i][0]);
      cost += (upto - prev) * tiers[i][1];
      prev = tiers[i][0];
    }
    return cost;
  }
  registry.calculator.render = function (c) {
    c.classList.add('calc-host');
    var fields = [
      ['req', 'API requests per month', 1000000],
      ['ms', 'Average Lambda duration (ms)', 120],
      ['mb', 'Lambda memory (MB)', 512],
      ['reads', 'DynamoDB reads per request', 1],
      ['writes', 'DynamoDB writes per request', 1],
      ['gb', 'DynamoDB storage (GB)', 1]
    ];
    c.innerHTML = '<div class="calc"><h2>Serverless API cost estimate</h2><p class="sub">HTTP API, Lambda and DynamoDB on demand. Change any number.</p>' +
      '<div class="calc-form">' + fields.map(function (f) {
        return '<label for="calc-' + f[0] + '">' + f[1] + '</label><input id="calc-' + f[0] + '" data-k="' + f[0] + '" type="number" min="0" step="any" value="' + f[2] + '">';
      }).join('') + '</div><table class="calc-out"><tbody></tbody></table>' +
      '<p class="fine">On-demand prices for US East (N. Virginia), taken from the AWS Price List API (Lambda and API Gateway files published 1 to 2 October 2026, DynamoDB 11 September 2026). ' +
      'Excludes the AWS Free Tier, data transfer and tax. Assumes x86 Lambda, reads of items up to 4 KB (strongly consistent) and writes up to 1 KB.</p></div>';
    function money(v) { return '$' + (v > 0 && v < 0.01 ? v.toFixed(4) : v.toFixed(2)); }
    function calc() {
      var v = {};
      c.querySelectorAll('input').forEach(function (i) { v[i.getAttribute('data-k')] = Math.max(0, parseFloat(i.value) || 0); });
      var gbSec = v.req * (v.ms / 1000) * (v.mb / 1024);
      var rows = [
        ['API Gateway (HTTP API)', tiered(v.req, PRICE.httpApi)],
        ['Lambda requests', v.req * PRICE.lambdaReq],
        ['Lambda compute (' + Math.round(gbSec).toLocaleString() + ' GB-seconds)', tiered(gbSec, PRICE.lambdaTiers)],
        ['DynamoDB reads', v.req * v.reads * PRICE.ddbRead],
        ['DynamoDB writes', v.req * v.writes * PRICE.ddbWrite],
        ['DynamoDB storage (first 25 GB free)', Math.max(0, v.gb - PRICE.ddbFreeGB) * PRICE.ddbGB]
      ];
      var total = rows.reduce(function (s, r) { return s + r[1]; }, 0);
      c.querySelector('tbody').innerHTML = rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + money(r[1]) + '</td></tr>'; }).join('') +
        '<tr class="total"><td>Estimated monthly total</td><td>' + money(total) + '</td></tr>';
    }
    c.querySelectorAll('input').forEach(function (i) { i.addEventListener('input', calc); });
    calc();
  };

  // ---------- App icons for Launchpad and Stacks ----------
  function dockIcon(id) { var b = dockEl.querySelector('[data-open="' + id + '"] svg'); return b ? b.outerHTML : ''; }
  var EXTRA_ICONS = {
    activity: '<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1d1f24"/><rect x="8" y="10" width="48" height="44" rx="5" fill="#2b2e35"/><path d="M12 40h9l5-14 7 22 6-16 4 8h9" stroke="#4cd964" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>',
    maps: '<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#e8efe3"/><path d="M0 40 64 22v12L0 52z" fill="#f7d36b"/><path d="M22 0h10L18 64H8z" fill="#fff"/><path d="M42 14a8 8 0 0 1 8 8c0 7-8 15-8 15s-8-8-8-15a8 8 0 0 1 8-8z" fill="#e5483e"/><circle cx="42" cy="22" r="3" fill="#fff"/></svg>',
    photos: '<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#fff"/><rect x="10" y="14" width="44" height="36" rx="4" fill="#9fd0ef"/><circle cx="42" cy="24" r="5" fill="#ffd34d"/><path d="M10 44 24 30l10 10 6-6 14 14v2a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4z" fill="#3f8f5a"/></svg>',
    sysinfo: '<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#5b6270"/><rect x="18" y="18" width="28" height="28" rx="4" fill="#d6dae1"/><rect x="25" y="25" width="14" height="14" rx="2" fill="#5b6270"/><g stroke="#d6dae1" stroke-width="3" stroke-linecap="round"><path d="M24 10v6M32 10v6M40 10v6M24 48v6M32 48v6M40 48v6M10 24h6M10 32h6M10 40h6M48 24h6M48 32h6M48 40h6"/></g></svg>',
    calculator: '<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2a2a2e"/><rect x="12" y="10" width="40" height="12" rx="3" fill="#8e9aa6"/><g fill="#5c5c62"><rect x="12" y="28" width="11" height="9" rx="2"/><rect x="26" y="28" width="11" height="9" rx="2"/><rect x="12" y="41" width="11" height="9" rx="2"/><rect x="26" y="41" width="11" height="9" rx="2"/></g><rect x="41" y="28" width="11" height="22" rx="2" fill="#f19a37"/></svg>'
  };
  var LAUNCH = [
    ['finder', 'Finder'], ['safari', 'Safari'], ['terminal', 'Terminal'], ['notes', 'Notes'], ['preview', 'Preview'], ['calendar', 'Calendar'],
    ['activity', 'Activity Monitor'], ['maps', 'Maps'], ['photos', 'Photos'], ['sysinfo', 'System Information'], ['calculator', 'Calculator']
  ];

  // ---------- Launchpad ----------
  var launchEl = document.getElementById('launchpad');
  (function () {
    var grid = launchEl.querySelector('.lp-grid');
    LAUNCH.forEach(function (a) {
      var b = document.createElement('button');
      b.className = 'lp-app';
      b.innerHTML = (EXTRA_ICONS[a[0]] || dockIcon(a[0])) + '<span></span>';
      b.querySelector('span').textContent = a[1];
      b.addEventListener('click', function () { hideLaunchpad(); openWindow(a[0]); });
      grid.appendChild(b);
    });
    launchEl.addEventListener('click', function (e) { if (!e.target.closest('.lp-app')) hideLaunchpad(); });
  })();
  function toggleLaunchpad() { if (launchEl.classList.contains('show')) hideLaunchpad(); else { hideMenu(); launchEl.classList.add('show'); } }
  function hideLaunchpad() { launchEl.classList.remove('show'); }

  // ---------- Mission Control and Show Desktop ----------
  var mcOn = false;
  function missionControl() {
    if (mcOn) return exitMissionControl();
    var ids = Object.keys(open).filter(function (k) { return !open[k].min; });
    if (!ids.length) return;
    hideMenu(); hideLaunchpad(); document.body.classList.remove('show-desktop');
    mcOn = true;
    document.body.classList.add('mc');
    var cols = Math.ceil(Math.sqrt(ids.length)), rows = Math.ceil(ids.length / cols);
    var areaW = window.innerWidth - 80, areaH = window.innerHeight - MENU_TOP - 140;
    var cw = areaW / cols, ch = areaH / rows;
    ids.forEach(function (k, i) {
      var el = open[k].el, r = rectOf(el);
      var s = Math.min(cw * 0.86 / r.w, ch * 0.86 / r.h, 1);
      var cx = 40 + cw * (i % cols) + cw / 2, cy = MENU_TOP + 40 + ch * Math.floor(i / cols) + ch / 2;
      el.style.transformOrigin = '50% 50%';
      el.style.transform = 'translate(' + (cx - (r.x + r.w / 2)) + 'px,' + (cy - (r.y + r.h / 2)) + 'px) scale(' + s + ')';
    });
  }
  function exitMissionControl(pick) {
    if (!mcOn) return;
    mcOn = false;
    document.body.classList.remove('mc');
    Object.keys(open).forEach(function (k) { if (!open[k].min) { open[k].el.style.transform = ''; open[k].el.style.transformOrigin = ''; } });
    if (pick) focus(pick);
  }
  layer.addEventListener('click', function (e) {
    if (!mcOn) return;
    var w = e.target.closest('.window');
    if (!w) return;
    e.stopPropagation();
    var id = Object.keys(open).filter(function (k) { return open[k].el === w; })[0];
    exitMissionControl(id);
  }, true);
  document.querySelector('.mc-shade').addEventListener('click', function () { exitMissionControl(); });
  function toggleShowDesktop() {
    if (mcOn) exitMissionControl();
    document.body.classList.toggle('show-desktop');
  }
  desktop.addEventListener('pointerdown', function (e) {
    if (e.target === desktop && document.body.classList.contains('show-desktop')) document.body.classList.remove('show-desktop');
  });

  // Hot corners: bottom-left opens Mission Control, bottom-right shows the desktop
  var cornerTimer = null, cornerAt = null;
  document.addEventListener('mousemove', function (e) {
    if (document.body.classList.contains('locked')) return;
    var w = window.innerWidth, h = window.innerHeight, c = null;
    if (e.clientY >= h - 3 && e.clientX <= 3) c = 'bl';
    else if (e.clientY >= h - 3 && e.clientX >= w - 3) c = 'br';
    if (c === cornerAt) return;
    cornerAt = c;
    clearTimeout(cornerTimer);
    if (c) cornerTimer = setTimeout(function () { if (c === 'bl') missionControl(); else toggleShowDesktop(); }, 250);
  });

  // ---------- Widgets: open from the date and time ----------
  var widgetsEl = document.getElementById('widgets');
  var WIDGETS = {
    calendar: { name: 'Calendar', draw: function (el) {
      var now = new Date(), up = upcoming(3);
      el.innerHTML = '<h3>Calendar</h3><div class="day"></div><div class="big"></div><ul></ul>';
      el.querySelector('.day').textContent = now.toLocaleDateString(undefined, { weekday: 'long' }).toUpperCase();
      el.querySelector('.big').textContent = now.getDate();
      var ul = el.querySelector('ul');
      if (!up.length) ul.innerHTML = '<li class="muted">No upcoming events.</li>';
      up.forEach(function (e) { var li = document.createElement('li'); li.textContent = e.title + ' · ' + fmtDate(e.date); ul.appendChild(li); });
    } },
    writing: { name: 'Latest Writing', draw: function (el) {
      el.innerHTML = '<h3>Latest Writing</h3><ul></ul>';
      NOTES.forEach(function (n, i) {
        var li = document.createElement('li'), b = document.createElement('button');
        b.textContent = n.title;
        b.addEventListener('click', function () { closeWidgets(); openNote(i); });
        li.appendChild(b); el.querySelector('ul').appendChild(li);
      });
    } }
  };
  function widgetOrder() {
    try { var w = JSON.parse(store.get('widgets')); if (Array.isArray(w)) return w.filter(function (k) { return WIDGETS[k]; }); } catch (e) {}
    return ['calendar'];
  }
  function drawWidgets() {
    var order = widgetOrder(), list = widgetsEl.querySelector('.w-list'), gal = widgetsEl.querySelector('.w-gallery');
    list.innerHTML = '';
    order.forEach(function (k) {
      var el = document.createElement('section');
      el.className = 'widget';
      list.appendChild(el);
      WIDGETS[k].draw(el);
      var x = document.createElement('button');
      x.className = 'w-remove'; x.setAttribute('aria-label', 'Remove ' + WIDGETS[k].name); x.textContent = '−';
      x.addEventListener('click', function () { store.set('widgets', JSON.stringify(order.filter(function (o) { return o !== k; }))); drawWidgets(); });
      el.appendChild(x);
    });
    gal.innerHTML = '<h3>Add widgets</h3>';
    var missing = Object.keys(WIDGETS).filter(function (k) { return order.indexOf(k) < 0; });
    if (!missing.length) gal.innerHTML += '<div class="muted">All widgets are on the panel.</div>';
    missing.forEach(function (k) {
      var b = document.createElement('button');
      b.innerHTML = '<span></span><b>Add</b>';
      b.querySelector('span').textContent = WIDGETS[k].name;
      b.addEventListener('click', function () { store.set('widgets', JSON.stringify(order.concat([k]))); drawWidgets(); });
      gal.appendChild(b);
    });
  }
  function closeWidgets() { widgetsEl.classList.remove('show', 'editing'); widgetsEl.querySelector('.w-edit').textContent = 'Edit Widgets'; }
  document.getElementById('clock').addEventListener('click', function (e) {
    e.stopPropagation();
    if (widgetsEl.classList.contains('show')) closeWidgets();
    else { hideMenu(); drawWidgets(); widgetsEl.classList.add('show'); }
  });
  widgetsEl.querySelector('.w-edit').addEventListener('click', function () {
    var on = widgetsEl.classList.toggle('editing');
    this.textContent = on ? 'Done' : 'Edit Widgets';
  });
  document.addEventListener('pointerdown', function (e) {
    var t = e.target.closest ? e.target : document.body;
    if (widgetsEl.classList.contains('show') && !widgetsEl.contains(t) && !t.closest('#clock')) closeWidgets();
  });

  // ---------- Dock stack: Projects fans out above the Dock ----------
  var stackEl = document.getElementById('stack');
  var stackBtn = dockEl.querySelector('[data-stack]');
  function drawStack() {
    stackEl.innerHTML = '';
    places.projects.items.forEach(function (item) {
      var b = document.createElement('button');
      b.innerHTML = glyphs[item.icon] + '<span></span>';
      b.querySelector('span').textContent = item.name;
      b.addEventListener('click', function () { stackEl.classList.remove('show'); openWindow('projects', item.go); });
      stackEl.appendChild(b);
    });
    stackEl.appendChild(document.createElement('hr'));
    var f = document.createElement('button');
    f.textContent = 'Open in Finder';
    f.addEventListener('click', function () { stackEl.classList.remove('show'); openWindow('projects', 'projects'); });
    stackEl.appendChild(f);
  }
  stackBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (stackEl.classList.contains('show')) { stackEl.classList.remove('show'); return; }
    drawStack();
    stackEl.classList.add('show');
    var r = stackBtn.getBoundingClientRect();
    stackEl.style.left = Math.min(window.innerWidth - stackEl.offsetWidth - 8, r.left + r.width / 2 - stackEl.offsetWidth / 2) + 'px';
    stackEl.style.top = (r.top - stackEl.offsetHeight - 12) + 'px';
  });
  document.addEventListener('pointerdown', function (e) {
    var t = e.target.closest ? e.target : document.body;
    if (stackEl.classList.contains('show') && !stackEl.contains(t) && !t.closest('[data-stack]')) stackEl.classList.remove('show');
  });

  // ---------- Crash screen (Terminal: rm -rf /) ----------
  function crash() {
    var el = document.getElementById('crash');
    el.classList.add('show');
    function back() { try { sessionStorage.removeItem('notified'); } catch (e) {} location.reload(); }
    setTimeout(function () {
      el.addEventListener('click', back);
      document.addEventListener('keydown', back);
    }, 600);
  }

  // ---------- Welcome notification, once per visit ----------
  function notifyOnce() {
    try { if (sessionStorage.getItem('notified')) return; sessionStorage.setItem('notified', '1'); } catch (e) {}
    var n = document.getElementById('notif');
    setTimeout(function () { n.classList.add('show'); }, 1200);
    var hideT = setTimeout(function () { n.classList.remove('show'); }, 10000);
    n.querySelector('.x').addEventListener('click', function (e) { e.stopPropagation(); clearTimeout(hideT); n.classList.remove('show'); });
    n.addEventListener('click', function () { clearTimeout(hideT); n.classList.remove('show'); openWindow('certifications'); });
  }

  // ---------- Remember open windows between visits ----------
  var saveTimer;
  function saveSession() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      var list = Object.keys(open).sort(function (a, b) { return open[a].el.style.zIndex - open[b].el.style.zIndex; }).map(function (k) {
        var st = open[k], r = st.fs && st.prev ? st.prev : rectOf(st.el);
        return { id: k, loc: st.loc || null, x: r.x, y: r.y, w: r.w, h: r.h, fs: st.fs, min: st.min };
      });
      store.set('session', JSON.stringify(list));
    }, 200);
  }
  function restoreSession() {
    var list;
    try { list = JSON.parse(store.get('session')); } catch (e) { list = null; }
    if (!Array.isArray(list) || !list.length) return false;
    var any = false;
    list.forEach(function (s) {
      if (!registry[s.id] || s.id === 'launchpad') return;
      openWindow(s.id, places[s.loc] ? s.loc : null);
      var st = open[s.id];
      if (!st) return;
      any = true;
      place(st.el, {
        x: Math.min(Math.max(s.x, 0), window.innerWidth - 120), y: Math.min(Math.max(s.y, MENU_TOP), window.innerHeight - 80),
        w: Math.max(MIN_W, Math.min(s.w, window.innerWidth)), h: Math.max(MIN_H, Math.min(s.h, window.innerHeight - MENU_TOP))
      });
      if (s.fs) toggleFullscreen(s.id);
      if (s.min) minimise(s.id);
    });
    return any;
  }
  ['pointerup', 'keyup', 'click'].forEach(function (t) {
    document.addEventListener(t, function () { if (!document.body.classList.contains('locked')) saveSession(); }, true);
  });

  // Intro: every load, on a desktop-sized screen with a mouse (Skip is always there).
  // Phones, reduced motion and shared links go straight to the login.
  var deepLink = parseLink(location.hash);
  var introEl = document.getElementById('intro');
  if (!deepLink && !reduce && window.matchMedia('(min-width: 900px) and (pointer: fine)').matches) playIntro();
  else introEl.remove();
  function playIntro() {
    var video = introEl.querySelector('video'), done = false;
    document.body.classList.add('in-intro');
    function arrive() {
      loginEl.style.transition = 'none';                 // the card hands over in place: no fade on the swap
      document.body.classList.remove('in-intro');
      introEl.remove();
      loginEl.classList.add('arrive');
      requestAnimationFrame(function () { loginEl.style.transition = ''; });
      setTimeout(function () { login(); }, 1400);
    }
    function skip() {                                     // straight to the login
      if (done) return;
      done = true;
      video.pause();
      introEl.classList.add('leaving');
      setTimeout(arrive, 350);
    }
    function settle() {                                   // photo, name and title glide into their login places
      if (done) return;
      done = true;
      var moves = [['img', 'img'], ['.n', '.name'], ['.r', '.role']].map(function (p) {
        var from = introEl.querySelector('.intro-card ' + p[0]), to = loginEl.querySelector(p[1]);
        var a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
        var dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
        return from.animate([{ transform: 'none' }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + (b.height / a.height) + ')' }],
          { duration: 900, easing: 'cubic-bezier(0.77, 0, 0.175, 1)', fill: 'forwards' });
      });
      moves[0].finished.then(arrive);
    }
    function card() {                                     // photo, name and title over the island
      if (done || introEl.classList.contains('card-on')) return;
      introEl.classList.add('card-on');
      setTimeout(settle, 1500);
    }
    video.addEventListener('ended', card);
    // If the browser won't load or autoplay the film, still give the title card rather than nothing
    video.addEventListener('error', card);
    var started = video.play();
    if (started && started.catch) started.catch(function (err) { console.warn('Intro film did not play:', err && err.name); card(); });
    introEl.querySelector('.intro-skip').addEventListener('click', function (e) { e.stopPropagation(); skip(); });
    introEl.addEventListener('click', skip);
    document.addEventListener('keydown', function onKey(e) {
      if (!document.body.classList.contains('in-intro')) { document.removeEventListener('keydown', onKey, true); return; }
      e.preventDefault(); e.stopPropagation(); skip();
    }, true);
  }

  // A shared link skips the login and opens its window
  var deep = parseLink(location.hash);
  if (deep) login(deep.id, deep.loc);
  // Without the film (phones, reduced motion) the login card shows briefly, then the desktop opens
  else if (!document.body.classList.contains('in-intro')) setTimeout(function () { login(); }, 1600);
})();
</script>
